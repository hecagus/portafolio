<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18223f" />
  <title>Un ramo de girasoles para ti 🌻</title>
  <style>
    :root{
      color-scheme: dark;
      --bg1:#45548f;
      --bg2:#18223f;
      --ink:#f8f1e6;
      --muted:#d6d9ea;
      --petal1:#ffef9c;
      --petal2:#ffcb49;
      --petal3:#e98a21;
      --center1:#6a3b18;
      --center2:#3b200d;
      --leaf1:#95ca61;
      --leaf2:#2f7345;
      --paper1:#f9e5ec;
      --paper2:#eebdca;
      --paper3:#1f1f25;
      --paper4:#4a2034;
      --gold:#f2c649;
      --gold2:#dca92e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      overflow:hidden;
      font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 50% 20%, #5c68a8 0%, transparent 28%),
        radial-gradient(circle at 16% 12%, #ffffff12 0%, transparent 18%),
        radial-gradient(circle at 84% 17%, #ffd86f22 0%, transparent 15%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 78%);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.24;
      background-image: radial-gradient(#fff7d2 0.8px, transparent 1px);
      background-size: 42px 40px;
      mask-image: linear-gradient(to bottom, #000, transparent 86%);
    }
    main{
      width:min(100%, 760px);
      min-height:100svh;
      margin:auto;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      justify-items:center;
      padding:clamp(24px, 5vh, 54px) 18px max(30px, env(safe-area-inset-bottom));
      text-align:center;
      position:relative;
      isolation:isolate;
    }
    .eyebrow{margin:0 0 10px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#f8d78d;opacity:.92}
    h1{margin:0;font-size:clamp(30px, 7vw, 48px);line-height:1.06;letter-spacing:-.04em;font-weight:800;text-wrap:balance}
    .subtitle{margin:12px auto 0;max-width:390px;min-height:2.9em;font-size:clamp(14px, 3.8vw, 18px);line-height:1.5;color:var(--muted)}
    .scene{
      width:min(100%, 620px);
      max-height:min(67svh, 720px);
      overflow:visible;
      display:block;
      align-self:center;
      justify-self:center;
      filter:drop-shadow(0 18px 30px rgba(0,0,0,.22));
      cursor:pointer;
      touch-action:manipulation;
    }
    .controls{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:92px;gap:10px}
    button{
      appearance:none;border:1px solid #ffe2a066;background:linear-gradient(135deg,#ffe8a5,#f6bf48);color:#472810;
      border-radius:999px;padding:16px 27px;font:700 16px ui-rounded, "Trebuchet MS", system-ui, sans-serif;
      box-shadow:0 9px 28px rgba(248,192,72,.22);cursor:pointer;transition:transform .2s, box-shadow .2s
    }
    button:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(248,192,72,.32)}
    button:active{transform:scale(.98)}
    button:focus-visible{outline:3px solid #fff;outline-offset:4px}
    .hint{margin:0;font-size:12px;color:#b7bdd6}

    .seed{transform-origin:300px 660px; animation:seedBreath 1.8s ease-in-out infinite}
    .stem{stroke-dasharray:280;stroke-dashoffset:280}
    .leaf{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .petal,.inner-petal,.core,.halo,.mini-heart{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .paper{opacity:0;transform-box:fill-box;transform-origin:300px 555px;transform:translateY(24px) scale(.86)}
    .sparkle{opacity:0;transform-origin:center}

    .play .seed{animation:vanish .32s ease forwards}
    .play .stem{animation:growStem 1s cubic-bezier(.2,.76,.28,1) forwards;animation-delay:var(--sd)}
    .play .leaf{animation:leafOpen .7s cubic-bezier(.2,.8,.24,1.26) forwards;animation-delay:var(--ld)}
    .play .petal,.play .inner-petal{animation:petalOpen .62s cubic-bezier(.18,.8,.24,1.18) forwards;animation-delay:var(--pd)}
    .play .core{animation:coreOpen .58s cubic-bezier(.2,.8,.24,1.2) forwards;animation-delay:var(--cd)}
    .play .halo{animation:haloIn 1s ease forwards;animation-delay:var(--hd)}
    .play .paper{animation:wrapIn .92s cubic-bezier(.2,.8,.25,1.06) forwards;animation-delay:5.1s}
    .play .sparkle{animation:twinkle 2.2s ease-in-out infinite;animation-delay:var(--td)}
    .play .mini-heart{animation:heartIn .7s ease forwards;animation-delay:5.3s}

    @keyframes seedBreath{50%{transform:scale(1.12)}}
    @keyframes vanish{to{opacity:0;transform:scale(.1)}}
    @keyframes growStem{to{stroke-dashoffset:0}}
    @keyframes leafOpen{0%{opacity:0;transform:scale(0) rotate(-20deg)}70%{opacity:1;transform:scale(1.08) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes petalOpen{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
    @keyframes coreOpen{70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
    @keyframes haloIn{to{opacity:.46;transform:scale(1)}}
    @keyframes wrapIn{0%{opacity:0;transform:translateY(24px) scale(.86)}100%{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes twinkle{0%,100%{opacity:0;transform:scale(.2)}35%,65%{opacity:.9;transform:scale(1)}}
    @keyframes heartIn{0%{opacity:0;transform:translateY(8px) scale(.2)}100%{opacity:.9;transform:translateY(0) scale(1)}}

    @media (max-height:680px){
      main{padding-top:18px;padding-bottom:18px}
      .scene{max-height:56svh}
      .controls{min-height:72px}
      h1{font-size:30px}
    }
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Un pequeño regalo</p>
    <h1 id="title">Tengo un detalle para ti…</h1>
    <p class="subtitle" id="message" aria-live="polite"></p>
  </header>

  <svg class="scene" id="scene" viewBox="0 0 600 760" role="img" aria-label="Toca para formar un ramo de girasoles" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--leaf1)"/><stop offset="1" stop-color="var(--leaf2)"/></linearGradient>
      <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--petal1)"/><stop offset=".56" stop-color="var(--petal2)"/><stop offset="1" stop-color="var(--petal3)"/></linearGradient>
      <linearGradient id="petalInner" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd95d"/><stop offset="1" stop-color="#f19a1c"/></linearGradient>
      <radialGradient id="coreGrad"><stop stop-color="var(--center1)"/><stop offset=".76" stop-color="var(--center2)"/></radialGradient>
      <radialGradient id="haloGrad"><stop stop-color="#ffd567" stop-opacity=".46"/><stop offset="1" stop-color="#ffd567" stop-opacity="0"/></radialGradient>
      <linearGradient id="paperLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--paper1)"/><stop offset="1" stop-color="var(--paper2)"/></linearGradient>
      <linearGradient id="paperDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--paper3)"/><stop offset="1" stop-color="var(--paper4)"/></linearGradient>
    </defs>

    <ellipse cx="300" cy="694" rx="178" ry="24" fill="#07111f" opacity=".34"/>
    <g id="sparkles"></g>
    <g id="hearts"></g>
    <g id="stems"></g>
    <g id="flowers"></g>

    <g id="wrap">
      <path class="paper" d="M145 470 L282 580 L210 682 L88 560 Z" fill="url(#paperDark)"/>
      <path class="paper" d="M456 470 L320 580 L390 684 L516 560 Z" fill="url(#paperDark)"/>
      <path class="paper" d="M118 502 L286 598 L246 668 L92 581 Z" fill="url(#paperLight)"/>
      <path class="paper" d="M483 502 L314 598 L354 668 L508 581 Z" fill="url(#paperLight)"/>
      <path class="paper" d="M210 576 L390 576 L336 700 L264 700 Z" fill="url(#paperDark)"/>
      <path class="paper" d="M247 585 C273 563 328 563 353 585 C327 606 273 606 247 585 Z" fill="var(--gold)" style="animation-delay:5.4s"/>
      <path class="paper" d="M248 586 C226 602 220 625 214 650 C237 644 255 630 270 603 Z" fill="var(--gold2)" style="animation-delay:5.48s"/>
      <path class="paper" d="M352 586 C374 602 380 625 386 650 C363 644 345 630 330 603 Z" fill="var(--gold2)" style="animation-delay:5.48s"/>
    </g>

    <g class="seed" fill="#f8c44f">
      <circle cx="300" cy="654" r="11" opacity=".2"/>
      <path d="M300 668 Q284 654 291 640 Q307 636 309 655 Z" />
    </g>
  </svg>

  <div class="controls">
    <button type="button" id="action">🌱 Toca para empezar</button>
    <p class="hint" id="hint">También puedes tocar el dibujo</p>
  </div>
</main>

<script>
(() => {
  'use strict';
  const ns = 'http://www.w3.org/2000/svg';
  const scene = document.getElementById('scene');
  const button = document.getElementById('action');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const hint = document.getElementById('hint');
  const stems = document.getElementById('stems');
  const flowers = document.getElementById('flowers');
  const sparkles = document.getElementById('sparkles');
  const hearts = document.getElementById('hearts');

  function svg(tag, attrs, parent){
    const el = document.createElementNS(ns, tag);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k, String(v));
    parent.append(el);
    return el;
  }

  function addFlower(cfg){
    svg('path', {
      class:'stem', d:cfg.stem, fill:'none', stroke:cfg.stroke, 'stroke-width':cfg.width, 'stroke-linecap':'round',
      style:`--sd:${cfg.delay.toFixed(2)}s`
    }, stems);

    cfg.leaves.forEach((leaf, i) => {
      svg('path', {
        class:'leaf', d:leaf, fill:'url(#leafGrad)', style:`--ld:${(cfg.delay + 0.55 + i*0.12).toFixed(2)}s`
      }, stems);
    });

    const group = svg('g', {transform:`translate(${cfg.x} ${cfg.y}) scale(${cfg.scale})`}, flowers);
    svg('circle', {class:'halo', cx:0, cy:0, r:70, fill:'url(#haloGrad)', style:`--hd:${(cfg.delay + 1.25).toFixed(2)}s`}, group);

    const back = svg('g', {}, group);
    for(let i=0;i<14;i++){
      const a = i*(360/14);
      const pet = svg('g', {transform:`rotate(${a})`}, back);
      svg('path', {
        class:'petal', d:'M -8 -16 C -28 -38 -29 -73 0 -97 C 29 -73 28 -38 8 -16 Z', fill:'url(#petalGrad)', stroke:'#df9a2a', 'stroke-width':'0.8',
        style:`--pd:${(cfg.delay + 0.82 + (i%4)*0.04).toFixed(2)}s`
      }, pet);
    }

    const inner = svg('g', {}, group);
    for(let i=0;i<14;i++){
      const a = i*(360/14) + 12;
      const pet = svg('g', {transform:`rotate(${a})`}, inner);
      svg('path', {
        class:'inner-petal', d:'M -6 -10 C -18 -28 -18 -52 0 -67 C 18 -52 18 -28 6 -10 Z', fill:'url(#petalInner)',
        style:`--pd:${(cfg.delay + 0.98 + (i%4)*0.035).toFixed(2)}s`
      }, pet);
    }

    const core = svg('g', {class:'core', style:`--cd:${(cfg.delay + 1.12).toFixed(2)}s`}, group);
    svg('circle', {cx:0, cy:0, r:33, fill:'#a36b24'}, core);
    svg('circle', {cx:0, cy:0, r:29, fill:'url(#coreGrad)'}, core);
    for(let n=0;n<72;n++){
      const r = 3.25*Math.sqrt(n), a = n*2.39996323;
      const cx = (Math.cos(a)*r).toFixed(2), cy = (Math.sin(a)*r).toFixed(2);
      svg('ellipse', {
        cx, cy, rx:n%3===0 ? 1.5 : 1.1, ry:n%3===0 ? 2.1 : 1.5,
        transform:`rotate(${(a*180/Math.PI+40).toFixed(1)} ${cx} ${cy})`,
        fill:n%4===0 ? '#ddaa53' : n%3===0 ? '#25160b' : '#b37a34', opacity:n%4===0 ? '.82' : '.72'
      }, core);
    }
    svg('circle', {cx:0, cy:0, r:28, fill:'none', stroke:'#e0a93c', 'stroke-width':'1.6', 'stroke-dasharray':'1 5', 'stroke-linecap':'round'}, core);
  }

  [
    {x:185, y:350, scale:0.84, delay:0.15, stroke:'#41794b', width:12, stem:'M225 582 C220 520 211 455 185 350', leaves:['M226 495 C190 462 164 465 140 435 C183 433 209 451 226 495 Z','M211 548 C172 525 152 525 126 500 C168 498 193 512 211 548 Z']},
    {x:245, y:292, scale:0.92, delay:0.95, stroke:'#3f7448', width:12, stem:'M265 588 C264 520 255 440 245 292', leaves:['M262 468 C227 441 203 442 178 416 C218 414 243 429 262 468 Z','M252 530 C287 503 314 502 339 475 C300 472 274 488 252 530 Z']},
    {x:300, y:248, scale:1.0, delay:1.75, stroke:'#4c8252', width:13, stem:'M300 592 C299 522 301 430 300 248', leaves:['M300 452 C263 422 236 423 208 392 C251 390 278 407 300 452 Z','M302 485 C339 456 366 456 392 426 C350 423 323 440 302 485 Z']},
    {x:355, y:292, scale:0.92, delay:2.55, stroke:'#3f7548', width:12, stem:'M335 588 C337 520 346 438 355 292', leaves:['M336 469 C300 442 275 441 250 416 C291 414 317 430 336 469 Z','M349 531 C387 503 413 503 439 476 C400 473 374 489 349 531 Z']},
    {x:415, y:350, scale:0.84, delay:3.35, stroke:'#477c4e', width:12, stem:'M375 582 C380 520 389 455 415 350', leaves:['M374 495 C411 462 437 465 460 435 C417 433 391 451 374 495 Z','M389 548 C428 525 448 525 474 500 C432 498 407 512 389 548 Z']}
  ].forEach(addFlower);

  [[86,162],[143,112],[220,88],[380,88],[455,112],[512,162],[90,420],[512,420],[176,62],[424,62]].forEach((p,i)=>{
    svg('path', {
      class:'sparkle',
      d:`M ${p[0]} ${p[1]-6} Q ${p[0]+1} ${p[1]-1} ${p[0]+6} ${p[1]} Q ${p[0]+1} ${p[1]+1} ${p[0]} ${p[1]+6} Q ${p[0]-1} ${p[1]+1} ${p[0]-6} ${p[1]} Q ${p[0]-1} ${p[1]-1} ${p[0]} ${p[1]-6}`,
      fill:'#ffe6a1',
      style:`--td:${(5.55 + i*0.12).toFixed(2)}s`
    }, sparkles);
  });

  [[252,132],[300,118],[348,132]].forEach((p,i)=>{
    svg('path', {
      class:'mini-heart',
      d:`M ${p[0]} ${p[1]} C ${p[0]-8} ${p[1]-10}, ${p[0]-22} ${p[1]-1}, ${p[0]} ${p[1]+16} C ${p[0]+22} ${p[1]-1}, ${p[0]+8} ${p[1]-10}, ${p[0]} ${p[1]}`,
      fill:'#ffd0dc',
      style:`--hd:${(5.48 + i*0.12).toFixed(2)}s`
    }, hearts);
  });

  let active = false;
  let running = false;
  let finishTimer;
  function play(){
    if(active) return;
    active = true;
    running = true;
    scene.classList.add('play');
    button.disabled = true;
    button.textContent = '✨ Preparando tu detalle…';
    hint.textContent = '';
    scene.setAttribute('aria-label', 'Ramo de girasoles apareciendo uno por uno y luego envolviéndose');
    finishTimer = setTimeout(() => {
      title.textContent = 'Un ramo de girasoles para ti, mi niña de ojos hermosos 🌻';
      message.textContent = 'Un detalle hecho con cariño del HecAgus, porque pensé en ti.';
      button.textContent = '↻ Ver otra vez';
      button.disabled = false;
      running = false;
    }, 6400);
  }
  function reset(){
    clearTimeout(finishTimer);
    scene.classList.remove('play');
    void scene.getBoundingClientRect();
    active = false;
    title.textContent = 'Tengo un detalle para ti…';
    message.textContent = '';
    hint.textContent = 'También puedes tocar el dibujo';
    button.textContent = '🌱 Toca para empezar';
  }
  function activate(){
    if(running) return;
    if(active) reset();
    play();
  }
  button.addEventListener('click', activate);
  scene.addEventListener('click', activate);
})();
</script>
</body>
</html>
