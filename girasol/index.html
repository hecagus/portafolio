<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13172e" />
  <title>Un girasol para ti, mi niña de ojos hermosos 🌻</title>
  <style>
    :root { color-scheme: dark; --gold: #ffca43; --ink: #f9f1df; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; overflow: hidden; font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; color: var(--ink); background: radial-gradient(ellipse at 50% 30%, #34345c 0%, #1c2344 43%, #111629 87%); }
    body::after { content:""; position: fixed; inset: 0; pointer-events:none; opacity:.23; background-image: radial-gradient(#e4dcbf 0.8px, transparent 1px); background-size: 43px 41px; mask-image: linear-gradient(to bottom, #000, transparent 85%); }
    main { position: relative; isolation: isolate; width: min(100%, 620px); min-height: 100svh; margin: auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; padding: clamp(28px, 6vh, 66px) 18px max(32px, env(safe-area-inset-bottom)); text-align: center; }
    .eyebrow { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #f9d78b; opacity: .88; margin: 0 0 10px; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 47px); line-height: 1.08; letter-spacing: -.035em; font-weight: 750; text-wrap: balance; }
    .subtitle { margin: 13px auto 0; min-height: 2.8em; font-size: clamp(14px, 3.7vw, 17px); line-height: 1.5; color: #c9cadc; max-width: 310px; transition: opacity .3s; }
    .garden { width: min(100%, 470px); max-height: min(65svh, 590px); align-self: center; justify-self: center; display: block; overflow: visible; filter: drop-shadow(0px 18px 30px #070c22a0); cursor: pointer; touch-action: manipulation; }
    .halo { opacity: 0; transform-origin: 200px 188px; }
    .stem { stroke-dasharray: 290; stroke-dashoffset: 290; }
    .leaf { transform-box: fill-box; transform-origin: center bottom; transform: scale(0); }
    .petal { transform-origin: 200px 187px; transform: scale(0); opacity: 0; }
    .inner-petal { transform-origin: 200px 187px; transform: scale(0); opacity: 0; }
    .center { transform-origin: 200px 187px; transform: scale(0); opacity: 0; }
    .sparkle { opacity: 0; transform-origin: center; }
    .seed { transform-origin: 200px 425px; animation: seedBreath 1.8s ease-in-out infinite; }
    .bloom .seed { animation: disappear .35s ease forwards; }
    .bloom .stem { animation: growStem 1.25s .12s cubic-bezier(.2,.7,.3,1) forwards; }
    .bloom .leaf { animation: leafOpen .8s cubic-bezier(.18,.8,.25,1.35) forwards; animation-delay: var(--d); }
    .bloom .petal { animation: petalOpen .82s cubic-bezier(.18,.8,.22,1.2) forwards; animation-delay: var(--d); }
    .bloom .inner-petal { animation: petalOpen .68s cubic-bezier(.18,.8,.22,1.2) forwards; animation-delay: var(--d); }
    .bloom .center { animation: coreOpen .75s 2.2s cubic-bezier(.2,.8,.25,1.3) forwards; }
    .bloom .halo { animation: haloIn 1.5s 2.25s ease forwards; }
    .bloom .sparkle { animation: twinkle 2.5s ease-in-out infinite; animation-delay: var(--d); }
    @keyframes seedBreath { 50% { transform: scale(1.13); } }
    @keyframes disappear { to {opacity:0;transform:scale(.1);} }
    @keyframes growStem { to {stroke-dashoffset:0;} }
    @keyframes leafOpen { 0%{transform:scale(0) rotate(-20deg);} 70%{transform:scale(1.1) rotate(4deg);} 100%{transform:scale(1) rotate(0);} }
    @keyframes petalOpen { 0%{transform:scale(0) rotate(-9deg);opacity:0;} 70%{transform:scale(1.1) rotate(2deg);opacity:1;} 100%{transform:scale(1);opacity:1;} }
    @keyframes coreOpen { 70%{transform:scale(1.11);opacity:1;} 100%{transform:scale(1);opacity:1;} }
    @keyframes haloIn { to {opacity:.62;} }
    @keyframes twinkle { 0%,100%{opacity:0;transform:scale(.2);} 40%,60%{opacity:.9;transform:scale(1);} }
    .controls { display:flex; flex-direction: column; align-items:center; min-height:91px; justify-content:center; gap:10px; }
    button { appearance:none; border: 1px solid #ffe5a266; background:linear-gradient(135deg,#ffe39c,#f7bd47); color:#402913; border-radius:999px; padding:16px 27px; font:700 16px ui-rounded, "Trebuchet MS", system-ui,sans-serif; box-shadow: 0 8px 28px #f1bd4a35; cursor:pointer; transition:transform .2s, box-shadow .2s; }
    button:hover {transform:translateY(-2px);box-shadow:0 12px 35px #f1bd4a55;}
    button:active {transform:scale(.97);} button:focus-visible {outline:3px solid #fff;outline-offset:4px;}
    .hint {font-size:12px;color:#aaaec9;margin:0;letter-spacing:.015em;}
    @media (max-height:640px) {main{padding-top:18px;padding-bottom:18px}.garden{max-height:53svh}.controls{min-height:70px}h1{font-size:30px}}
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after {animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;} }
  </style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Un pequeño regalo</p>
    <h1 id="title">Hay algo para ti…</h1>
    <p class="subtitle" id="message" aria-live="polite">A veces, las cosas más bonitas empiezan con un simple toque.</p>
  </header>
  <svg class="garden" id="flower" viewBox="0 0 400 520" role="img" aria-label="Toca para hacer crecer un girasol" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow"><stop stop-color="#ffca47" stop-opacity=".43"/><stop offset="1" stop-color="#ffca47" stop-opacity="0"/></radialGradient>
      <linearGradient id="petalColor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe98b"/><stop offset=".53" stop-color="#ffc843"/><stop offset="1" stop-color="#e98222"/></linearGradient>
      <linearGradient id="petalInside" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd255"/><stop offset="1" stop-color="#f1941e"/></linearGradient>
      <radialGradient id="disk"><stop stop-color="#70401c"/><stop offset=".67" stop-color="#593013"/><stop offset="1" stop-color="#3a210f"/></radialGradient>
      <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#89bc59"/><stop offset="1" stop-color="#286b45"/></linearGradient>
      <clipPath id="discClip"><circle cx="200" cy="187" r="43"/></clipPath>
    </defs>
    <ellipse cx="200" cy="478" rx="106" ry="14" fill="#050b19" opacity=".35" />
    <circle class="halo" cx="200" cy="187" r="158" fill="url(#glow)"/>
    <g id="sparkles"></g>
    <g id="plant">
      <path class="stem" d="M200 441 C195 365 210 282 200 197" fill="none" stroke="#467c48" stroke-width="13" stroke-linecap="round"/>
      <path class="stem" d="M197 440 C193 365 208 282 198 197" fill="none" stroke="#8dbd57" stroke-width="3" stroke-linecap="round" style="animation-delay:.2s"/>
      <path class="leaf" style="--d:1.03s" d="M201 355 C153 308 115 327 102 285 C154 282 187 310 201 355 Z" fill="url(#green)"/>
      <path class="leaf" style="--d:1.22s" d="M201 355 Q156 321 116 297" fill="none" stroke="#b5d576" stroke-width="2"/>
      <path class="leaf" style="--d:1.28s" d="M202 304 C243 245 286 279 297 254 C285 307 250 326 202 304 Z" fill="url(#green)"/>
      <path class="leaf" style="--d:1.45s" d="M204 304 Q256 298 287 267" fill="none" stroke="#b5d576" stroke-width="2"/>
      <g id="petals-back"></g>
      <g id="petals-front"></g>
      <g class="center">
        <circle cx="200" cy="187" r="51" fill="#b87520"/>
        <circle cx="200" cy="187" r="45" fill="url(#disk)"/>
        <g id="seeds" clip-path="url(#discClip)"></g>
        <circle cx="200" cy="187" r="44" fill="none" stroke="#e3a638" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
        <circle cx="200" cy="187" r="37" fill="none" stroke="#b47321" stroke-opacity=".35" stroke-width="2"/>
      </g>
    </g>
    <g class="seed" fill="#f8c44f"><circle cx="200" cy="425" r="11" opacity=".22"/><path d="M200 435 Q184 422 191 410 Q206 406 208 424Z" /></g>
  </svg>
  <div class="controls">
    <button type="button" id="action">🌱 Toca para florecer</button>
    <p class="hint" id="hint">También puedes tocar cualquier parte de la flor</p>
  </div>
</main>
<script>
(() => {
  'use strict';
  const ns = 'http://www.w3.org/2000/svg';
  const flower = document.getElementById('flower');
  const button = document.getElementById('action');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const hint = document.getElementById('hint');
  function svg(tag, attrs, parent) { const el = document.createElementNS(ns,tag); for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,String(v)); parent.append(el); return el; }
  for (let i = 0; i < 21; i++) {
    const angle = i * 360 / 21;
    const back = svg('g',{transform:`rotate(${angle} 200 187)`},document.getElementById('petals-back'));
    svg('path',{class:'petal',d:'M 194 170 C 173 140 177 98 200 72 C 223 98 227 140 206 170 Z',fill:'url(#petalColor)',stroke:'#e6a32e','stroke-width':'.8',style:`--d:${(1.43 + (i%7)*.095).toFixed(3)}s`},back);
    const front = svg('g',{transform:`rotate(${angle + 360/42} 200 187)`},document.getElementById('petals-front'));
    svg('path',{class:'inner-petal',d:'M 196 176 C 183 149 184 119 200 102 C 216 119 217 149 204 176 Z',fill:'url(#petalInside)',style:`--d:${(1.77 + (i%7)*.07).toFixed(3)}s`},front);
  }
  const seeds = document.getElementById('seeds');
  for (let n = 0; n < 165; n++) {
    const r = 4.04*Math.sqrt(n), a = n*2.39996323;
    svg('ellipse',{cx:(200+Math.cos(a)*r).toFixed(2),cy:(187+Math.sin(a)*r).toFixed(2),rx:n%3===0?1.9:1.35,ry:n%3===0?2.5:1.8,transform:`rotate(${(a*180/Math.PI+42).toFixed(1)} ${(200+Math.cos(a)*r).toFixed(2)} ${(187+Math.sin(a)*r).toFixed(2)})`,fill:n%4===0?'#e2a64e':n%3===0?'#29190d':'#b77b38',opacity:n%4===0?.8:.7},seeds);
  }
  const sparks = document.getElementById('sparkles');
  for (const [i,x,y] of [[0,65,135],[1,315,100],[2,85,270],[3,337,280],[4,143,65],[5,274,332],[6,330,182],[7,58,215],[8,258,65],[9,107,380]]) {
    svg('path',{class:'sparkle',d:`M ${x} ${y-6} Q ${x+1} ${y-1} ${x+6} ${y} Q ${x+1} ${y+1} ${x} ${y+6} Q ${x-1} ${y+1} ${x-6} ${y} Q ${x-1} ${y-1} ${x} ${y-6}`,fill:'#ffe4a0',style:`--d:${2.5+i*.22}s`},sparks);
  }
  let blooming = false;
  function bloom() {
    if (blooming) return;
    blooming = true;
    flower.classList.add('bloom');
    flower.setAttribute('aria-label','Girasol creciendo y floreciendo');
    button.disabled = true;
    button.textContent = '✨ Floreciendo…';
    hint.textContent = 'Un detalle hecho con cariño del HecAgus';
    setTimeout(() => {
      title.textContent = 'Un girasol para ti, mi niña de ojos hermosos 🌻';
      message.textContent = 'Un detalle hecho con cariño del HecAgus.';
      button.textContent = '↻ Volver a florecer';
      button.disabled = false;
    }, 3200);
  }
  button.addEventListener('click', () => {
    if (!blooming) bloom();
    else {
      flower.classList.remove('bloom');
      void flower.getBoundingClientRect();
      blooming=false;
      title.textContent='Hay algo para ti…';
      message.textContent='A veces, las cosas más bonitas empiezan con un simple toque.';
      button.textContent='🌱 Toca para florecer';
      hint.textContent='También puedes tocar cualquier parte de la flor';
      bloom();
    }
  });
  flower.addEventListener('click',bloom);
  flower.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();bloom();}});
  flower.setAttribute('tabindex','0');
})();
</script>
</body>
</html>
